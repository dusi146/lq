<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUẢN LÝ ACC VANCAU88</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --primary: #8b5cf6;
            --primary-glow: rgba(139, 92, 246, 0.45);
            --cyan: #06b6d4;
            --cyan-glow: rgba(6, 182, 212, 0.4);
            --live: #10b981;
            --ban: #f43f5e;
            --glass-bg: rgba(15, 23, 42, 0.7);
            --glass-border: rgba(255, 255, 255, 0.12);
        }

        body {
            min-height: 100vh;
            background: #040711;
            color: #f1f5f9;
            padding: 24px 12px 60px;
            display: flex;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .ambient-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
            animation: floatGlow 14s infinite alternate ease-in-out;
        }
        .glow-1 { width: 380px; height: 380px; background: radial-gradient(circle, #6366f1, #a855f7); top: -80px; left: -80px; }
        .glow-2 { width: 420px; height: 420px; background: radial-gradient(circle, #06b6d4, #3b82f6); bottom: -100px; right: -100px; animation-duration: 18s; }
        .glow-3 { width: 280px; height: 280px; background: radial-gradient(circle, #ec4899, #8b5cf6); top: 35%; left: 50%; transform: translate(-50%, -50%); opacity: 0.3; }

        @keyframes floatGlow {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(45px, 35px) scale(1.15); }
        }

        .container {
            width: 100%;
            max-width: 1000px;
            position: relative;
            z-index: 1;
        }

        /* Liquid Glass Card Base */
        .glass {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(190%);
            -webkit-backdrop-filter: blur(20px) saturate(190%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            position: relative;
        }

        /* Header */
        .header { text-align: center; margin-bottom: 20px; }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.35);
            border-radius: 999px;
            font-size: 10px;
            letter-spacing: 1.8px;
            font-weight: 800;
            color: #c4b5fd;
            margin-bottom: 10px;
            box-shadow: 0 0 16px var(--primary-glow);
        }
        .brand-badge::before {
            content: '';
            width: 6px;
            height: 6px;
            background: #a855f7;
            border-radius: 50%;
            box-shadow: 0 0 8px #a855f7;
        }
        h1 {
            font-size: clamp(22px, 5vw, 32px);
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(135deg, #ffffff 0%, #38bdf8 50%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-card {
            padding: 12px 14px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .stat-info span {
            font-size: 10.5px;
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            display: block;
        }
        .stat-info h2 {
            font-size: clamp(18px, 4vw, 24px);
            font-weight: 800;
            margin-top: 2px;
        }
        .stat-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        /* Form Nhập */
        .card-form { padding: 18px; margin-bottom: 18px; }
        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.5fr 1fr 1fr auto;
            gap: 10px;
            align-items: center;
        }
        
        input, select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(2, 6, 23, 0.65);
            color: #f8fafc;
            outline: none;
            font-size: 13.5px;
            transition: all 0.2s ease;
        }
        input:focus, select:focus {
            border-color: #38bdf8;
            background: rgba(2, 6, 23, 0.9);
            box-shadow: 0 0 16px rgba(56, 189, 248, 0.25);
        }
        select option { background: #0f172a; color: #fff; }

        .btn-add {
            background: linear-gradient(135deg, #06b6d4, #3b82f6, #8b5cf6);
            background-size: 200% 200%;
            color: #fff;
            font-weight: 700;
            border: none;
            cursor: pointer;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 14px;
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.35);
            transition: all 0.25s ease;
            white-space: nowrap;
        }
        .btn-add:active { transform: scale(0.96); }

        .hint {
            font-size: 11.5px;
            color: #64748b;
            margin-top: 10px;
            line-height: 1.4;
        }

        /* Toolbar */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .filter-group {
            display: flex;
            background: rgba(2, 6, 23, 0.6);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 4px;
        }
        .btn-filter {
            background: transparent;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            padding: 7px 14px;
            border-radius: 8px;
            font-size: 12.5px;
            font-weight: 700;
        }
        .btn-filter.active {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(139, 92, 246, 0.25));
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.35);
        }

        .btn-sync {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #e2e8f0;
            cursor: pointer;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-sync:active { transform: scale(0.96); }

        /* Bảng Table trên PC */
        .table-wrap { border-radius: 20px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td {
            padding: 14px 18px;
            font-size: 13.5px;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        th {
            background: rgba(2, 6, 23, 0.7);
            color: #94a3b8;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.8px;
        }
        tr:hover td { background: rgba(255, 255, 255, 0.02); }

        .acc-name {
            font-weight: 700;
            color: #f8fafc;
            letter-spacing: 0.4px;
            word-break: break-all;
        }
        .acc-note {
            font-size: 12px;
            color: #38bdf8;
            margin-top: 4px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(56, 189, 248, 0.1);
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            max-width: 100%;
            word-break: break-word;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 7px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }
        .badge-live { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.3); }
        .badge-banned { background: rgba(244, 63, 94, 0.15); color: #fb7185; border: 1px solid rgba(251, 113, 133, 0.3); }
        .badge-days { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(252, 211, 77, 0.25); margin-left: 6px; font-weight: 600; text-transform: none; }
        .badge-today { background: rgba(6, 182, 212, 0.2); color: #38bdf8; border: 1px solid rgba(56, 189, 248, 0.35); margin-left: 6px; }
        .badge-auto { background: rgba(168, 85, 247, 0.2); color: #d8b4fe; border: 1px solid rgba(216, 180, 254, 0.35); margin-left: 6px; font-size: 10px; }

        /* Action Buttons */
        .actions { display: flex; gap: 6px; justify-content: flex-end; }
        .btn-act {
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            transition: all 0.2s ease;
        }
        .btn-act:active { transform: scale(0.94); }
        .btn-act.copy:hover { border-color: #38bdf8; color: #38bdf8; }
        .btn-act.edit:hover { border-color: #fbbf24; color: #fbbf24; }
        .btn-act.del:hover { border-color: #f43f5e; color: #f43f5e; }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(12px);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }
        .modal {
            background: #0b1120;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 24px;
            border-radius: 20px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            animation: modalPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.92); }
            100% { opacity: 1; transform: scale(1); }
        }
        .modal h3 { margin-bottom: 16px; font-size: 17px; font-weight: 800; color: #38bdf8; }
        .modal-field { margin-bottom: 14px; }
        .modal-field label { display: block; font-size: 11.5px; font-weight: 700; color: #94a3b8; margin-bottom: 5px; text-transform: uppercase; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 20px; }

        /* Custom Designed Toast System */
        #toastContainer {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: none;
            max-width: 350px;
            width: calc(100% - 40px);
        }
        .custom-toast {
            pointer-events: auto;
            background: rgba(11, 17, 32, 0.92);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 14px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 12px 35px rgba(0,0,0,0.6);
            overflow: hidden;
            position: relative;
            animation: toastIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transition: all 0.3s ease;
        }
        .custom-toast.hide {
            animation: toastOut 0.3s forwards ease;
        }
        .toast-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            flex-shrink: 0;
        }
        .toast-msg {
            font-size: 13px;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.4;
            flex: 1;
            word-break: break-word;
        }
        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
        }
        .toast-progress-bar {
            height: 100%;
            width: 100%;
            animation: progressCount 2.4s linear forwards;
        }

        /* Toast Colors */
        .toast-success { border-color: rgba(52, 211, 153, 0.4); box-shadow: 0 0 20px rgba(16, 185, 129, 0.25); }
        .toast-success .toast-icon { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .toast-success .toast-progress-bar { background: #34d399; }

        .toast-info { border-color: rgba(56, 189, 248, 0.4); box-shadow: 0 0 20px rgba(6, 182, 212, 0.25); }
        .toast-info .toast-icon { background: rgba(6, 182, 212, 0.2); color: #38bdf8; }
        .toast-info .toast-progress-bar { background: #38bdf8; }

        .toast-warn { border-color: rgba(244, 63, 94, 0.4); box-shadow: 0 0 20px rgba(244, 63, 94, 0.25); }
        .toast-warn .toast-icon { background: rgba(244, 63, 94, 0.2); color: #fb7185; }
        .toast-warn .toast-progress-bar { background: #fb7185; }

        @keyframes toastIn {
            0% { opacity: 0; transform: translateY(-20px) scale(0.9); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }
        @keyframes toastOut {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
        }
        @keyframes progressCount {
            0% { width: 100%; }
            100% { width: 0%; }
        }

        /* Responsive Mobile Tối Ưu Tột Đỉnh */
        @media (max-width: 680px) {
            body { padding: 16px 8px 50px; }
            .card-form { padding: 14px; }
            .form-grid { grid-template-columns: 1fr; gap: 8px; }
            .btn-add { width: 100%; padding: 13px; font-size: 15px; }

            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; justify-content: space-between; }
            .btn-filter { flex: 1; text-align: center; padding: 8px 4px; font-size: 12px; }
            .btn-sync { justify-content: center; width: 100%; }

            /* Chuyển bảng Table thành các Card Liquid Glass */
            .table-wrap { background: transparent; border: none; box-shadow: none; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead { display: none; }
            tbody { display: flex; flex-direction: column; gap: 10px; }
            tr {
                background: var(--glass-bg);
                backdrop-filter: blur(16px);
                border: 1px solid var(--glass-border);
                border-radius: 16px;
                padding: 14px;
                box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            }
            td {
                padding: 4px 0;
                border-bottom: none;
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            td:first-child {
                display: block;
                margin-bottom: 8px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
                padding-bottom: 8px;
            }
            .acc-name { font-size: 15px; }
            .actions { width: 100%; margin-top: 10px; padding-top: 8px; border-top: 1px solid rgba(255, 255, 255, 0.06); }
            .btn-act { flex: 1; text-align: center; padding: 8px; font-size: 13px; }
            #toastContainer { top: 12px; right: 12px; left: 12px; width: auto; max-width: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div class="ambient-glow glow-3"></div>

    <!-- Container Toast Riêng Biệt -->
    <div id="toastContainer"></div>

    <div class="container">
        
        <div class="header">
            <div class="brand-badge">HỆ THỐNG PRO</div>
            <h1>QUẢN LÝ ACC VANCAU88</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card glass">
                <div class="stat-info">
                    <span>Tổng Acc</span>
                    <h2 id="cntAll" style="color: #f8fafc;">0</h2>
                </div>
                <div class="stat-icon" style="background: rgba(255,255,255,0.05); color: #94a3b8;">🎮</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-info">
                    <span>Đang Sống</span>
                    <h2 id="cntLive" style="color: #34d399;">0</h2>
                </div>
                <div class="stat-icon" style="background: rgba(16, 185, 129, 0.15); color: #34d399;">⚡</div>
            </div>
            <div class="stat-card glass">
                <div class="stat-info">
                    <span>Bị Khóa</span>
                    <h2 id="cntBanned" style="color: #fb7185;">0</h2>
                </div>
                <div class="stat-icon" style="background: rgba(244, 63, 94, 0.15); color: #fb7185;">🔒</div>
            </div>
        </div>

        <div class="card-form glass">
            <form id="accForm" onsubmit="handleAdd(event)">
                <div class="form-grid">
                    <input type="text" id="accInfo" placeholder="taikhoan:matkhau" required autocomplete="off">
                    <input type="text" id="accNote" placeholder="Ghi chú (Skin, Rank, vv...)" autocomplete="off">
                    <select id="accStatus" onchange="toggleDateInput('accStatus', 'unbanDate')">
                        <option value="sống">Sống</option>
                        <option value="ban">Bị Ban</option>
                    </select>
                    <input type="text" id="unbanDate" placeholder="Mở ban (100826)" style="display: none;" onblur="formatDateInput(this)">
                    <button type="submit" class="btn-add">+ Thêm</button>
                </div>
                <div class="hint">
                    💡 Hỗ trợ gõ nhanh ngày 6 số (vd: 100826 -> 10/08/2026). Khi đến hoặc qua ngày hẹn, web tự đổi sang <b>Sống</b>.
                </div>
            </form>
        </div>

        <div class="toolbar">
            <div class="filter-group">
                <button class="btn-filter active" onclick="setFilter('all', this)">Tất cả (<span id="btnCntAll">0</span>)</button>
                <button class="btn-filter" onclick="setFilter('sống', this)">Sống (<span id="btnCntLive">0</span>)</button>
                <button class="btn-filter" onclick="setFilter('ban', this)">Bị Ban (<span id="btnCntBanned">0</span>)</button>
            </div>
            <button type="button" class="btn-sync" onclick="loadFromDataTxt(true)">↻ Đọc lại data.txt</button>
        </div>

        <div class="table-wrap glass">
            <table>
                <thead>
                    <tr>
                        <th>Tài khoản / Ghi chú</th>
                        <th>Trạng thái</th>
                        <th>Thời hạn mở</th>
                        <th style="text-align: right;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="accList"></tbody>
            </table>
        </div>

    </div>

    <!-- Modal Chỉnh Sửa -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>Chỉnh sửa tài khoản</h3>
            <input type="hidden" id="editId">
            <div class="modal-field">
                <label>Tài khoản : Mật khẩu</label>
                <input type="text" id="editAcc" required>
            </div>
            <div class="modal-field">
                <label>Ghi chú</label>
                <input type="text" id="editNote" placeholder="Ghi chú (Skin, Rank, vv...)">
            </div>
            <div class="modal-field">
                <label>Trạng thái</label>
                <select id="editStatus" onchange="toggleDateInput('editStatus', 'editDate')">
                    <option value="sống">Sống (Hoạt động)</option>
                    <option value="ban">Bị Ban (Khóa)</option>
                </select>
            </div>
            <div class="modal-field" id="editDateField">
                <label>Ngày mở ban (dd/mm/yyyy hoặc 6 số)</label>
                <input type="text" id="editDate" placeholder="dd/mm/yyyy" onblur="formatDateInput(this)">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-act" onclick="closeEditModal()">Hủy</button>
                <button type="button" class="btn-add" style="padding: 10px 20px;" onclick="saveEdit()">Lưu lại</button>
            </div>
        </div>
    </div>

    <script>
        let accounts = JSON.parse(localStorage.getItem('vancau88_accounts')) || [];
        let currentFilter = 'all';

        // Hệ thống Thông Báo Toast Tuỳ Biến
        function showCustomToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            
            let icon = '✓';
            if (type === 'info') icon = 'ℹ';
            if (type === 'warn') icon = '✕';

            toast.innerHTML = `
                <div class="toast-icon">${icon}</div>
                <div class="toast-msg">${message}</div>
                <div class="toast-progress"><div class="toast-progress-bar"></div></div>
            `;

            container.appendChild(toast);

            setTimeout(() => {
                toast.classList.add('hide');
                setTimeout(() => toast.remove(), 300);
            }, 2400);
        }

        function parseDateString(str) {
            if (!str || str === '-' || str === 'Chưa rõ') return null;
            const parts = str.split('/');
            if (parts.length !== 3) return null;
            return new Date(parseInt(parts[2], 10), parseInt(parts[1], 10) - 1, parseInt(parts[0], 10), 0, 0, 0);
        }

        function checkAutoUnban() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            let updated = false;

            accounts.forEach(acc => {
                if (acc.status === 'ban') {
                    const target = parseDateString(acc.unbanDate);
                    if (target && today >= target) {
                        acc.status = 'sống';
                        acc.autoUnbanned = true;
                        acc.unbanDate = '-';
                        updated = true;
                    }
                }
            });

            if (updated) {
                localStorage.setItem('vancau88_accounts', JSON.stringify(accounts));
            }
        }

        function formatRawDate(str) {
            if (!str) return '';
            let val = str.trim().replace(/\D/g, '');
            if (val.length === 6) return `${val.slice(0, 2)}/${val.slice(2, 4)}/20${val.slice(4, 6)}`;
            if (val.length === 8) return `${val.slice(0, 2)}/${val.slice(2, 4)}/${val.slice(4, 8)}`;
            return str;
        }

        function formatDateInput(input) {
            input.value = formatRawDate(input.value);
        }

        function toggleDateInput(selectId, inputId) {
            const status = document.getElementById(selectId).value;
            const input = document.getElementById(inputId);
            if (status === 'ban') {
                input.style.display = 'block';
                input.focus();
            } else {
                input.style.display = 'none';
                input.value = '';
            }
        }

        function getRemainingBadge(dateStr) {
            const target = parseDateString(dateStr);
            if (!target) return '';
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
            if (diffDays === 0) return '<span class="badge badge-today">Mở hôm nay</span>';
            if (diffDays > 0) return `<span class="badge badge-days">Còn ${diffDays} ngày</span>`;
            return '';
        }

        /* Đồng bộ định dạng: tk:mk|status|unbanDate|ghiChu */
        async function loadFromDataTxt(isManual = false) {
            try {
                const res = await fetch('./data.txt?t=' + Date.now());
                if (!res.ok) throw new Error('Không tìm thấy file data.txt');
                const text = await res.text();
                const lines = text.split('\n');
                const loaded = [];

                lines.forEach((line, idx) => {
                    const clean = line.trim();
                    if (!clean) return;
                    const parts = clean.split('|');
                    const acc = parts[0].trim();
                    const status = (parts[1] && parts[1].trim().toLowerCase() === 'ban') ? 'ban' : 'sống';
                    let date = '-';
                    if (status === 'ban') {
                        date = (parts[2] && parts[2].trim()) ? formatRawDate(parts[2].trim()) : 'Chưa rõ';
                    }
                    const note = parts[3] ? parts[3].trim() : '';

                    loaded.push({
                        id: Date.now() + idx,
                        acc: acc,
                        note: note,
                        status: status,
                        unbanDate: date,
                        autoUnbanned: false
                    });
                });

                if (loaded.length > 0) {
                    accounts = loaded;
                    saveAndRender();
                    showCustomToast(`Đồng bộ thành công ${loaded.length} tài khoản!`, 'info');
                }
            } catch (err) {
                if (isManual) showCustomToast('Lỗi: ' + err.message, 'warn');
            }
        }

        function handleAdd(e) {
            e.preventDefault();
            const accInfo = document.getElementById('accInfo').value.trim();
            const accNote = document.getElementById('accNote').value.trim();
            const status = document.getElementById('accStatus').value;
            let dateVal = document.getElementById('unbanDate').value.trim();

            if (status === 'ban') {
                dateVal = formatRawDate(dateVal);
            }

            accounts.unshift({
                id: Date.now(),
                acc: accInfo,
                note: accNote,
                status: status,
                unbanDate: status === 'ban' ? (dateVal || 'Chưa rõ') : '-',
                autoUnbanned: false
            });

            saveAndRender();
            document.getElementById('accForm').reset();
            toggleDateInput('accStatus', 'unbanDate');
            showCustomToast('Đã thêm tài khoản thành công!', 'success');
        }

        function openEditModal(id) {
            const item = accounts.find(a => a.id === id);
            if (!item) return;

            document.getElementById('editId').value = item.id;
            document.getElementById('editAcc').value = item.acc;
            document.getElementById('editNote').value = item.note || '';
            document.getElementById('editStatus').value = item.status;
            document.getElementById('editDate').value = item.unbanDate === '-' ? '' : item.unbanDate;
            
            toggleDateInput('editStatus', 'editDate');
            document.getElementById('editModal').style.display = 'flex';
        }

        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        function saveEdit() {
            const id = parseInt(document.getElementById('editId').value, 10);
            const item = accounts.find(a => a.id === id);
            if (!item) return;

            item.acc = document.getElementById('editAcc').value.trim();
            item.note = document.getElementById('editNote').value.trim();
            item.status = document.getElementById('editStatus').value;
            let dateVal = document.getElementById('editDate').value.trim();

            if (item.status === 'ban') {
                item.unbanDate = formatRawDate(dateVal) || 'Chưa rõ';
                item.autoUnbanned = false;
            } else {
                item.unbanDate = '-';
            }

            closeEditModal();
            saveAndRender();
            showCustomToast('Đã lưu thông tin tài khoản!', 'success');
        }

        function deleteAcc(id) {
            accounts = accounts.filter(item => item.id !== id);
            saveAndRender();
            showCustomToast('Đã xóa tài khoản!', 'warn');
        }

        function copyAcc(text) {
            navigator.clipboard.writeText(text);
            showCustomToast('Đã chép tài khoản: ' + text, 'info');
        }

        function setFilter(filter, el) {
            currentFilter = filter;
            document.querySelectorAll('.btn-filter').forEach(btn => btn.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function saveAndRender() {
            checkAutoUnban();
            localStorage.setItem('vancau88_accounts', JSON.stringify(accounts));
            render();
        }

        function render() {
            const cntLive = accounts.filter(a => a.status === 'sống').length;
            const cntBanned = accounts.filter(a => a.status === 'ban').length;
            
            document.getElementById('cntAll').innerText = accounts.length;
            document.getElementById('cntLive').innerText = cntLive;
            document.getElementById('cntBanned').innerText = cntBanned;

            document.getElementById('btnCntAll').innerText = accounts.length;
            document.getElementById('btnCntLive').innerText = cntLive;
            document.getElementById('btnCntBanned').innerText = cntBanned;

            const filtered = accounts.filter(item => {
                if (currentFilter === 'all') return true;
                return item.status === currentFilter;
            });

            const tbody = document.getElementById('accList');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 36px 0;">Không có tài khoản nào</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const isBan = item.status === 'ban';
                const remaining = isBan ? getRemainingBadge(item.unbanDate) : '';
                const autoBadge = item.autoUnbanned ? '<span class="badge badge-auto">Vừa mở</span>' : '';
                const noteHtml = item.note ? `<div class="acc-note">📝 ${item.note}</div>` : '';

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>
                        <div class="acc-name">${item.acc}</div>
                        ${noteHtml}
                    </td>
                    <td>
                        <span class="badge ${isBan ? 'badge-banned' : 'badge-live'}">
                            ${isBan ? '🔒 BAN' : '⚡ SỐNG'}
                        </span>
                        ${autoBadge}
                    </td>
                    <td><span style="color: ${isBan ? '#f1f5f9' : '#64748b'}">${item.unbanDate}</span> ${remaining}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-act copy" onclick="copyAcc('${item.acc}')">Copy</button>
                            <button class="btn-act edit" onclick="openEditModal(${item.id})">Sửa</button>
                            <button class="btn-act del" onclick="deleteAcc(${item.id})">Xóa</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        saveAndRender();
        loadFromDataTxt();
    </script>
</body>
</html>
