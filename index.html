<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUẢN LÝ ACC VANCAU88</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root { --primary-glow: rgba(139, 92, 246, 0.4); --live-glow: rgba(16, 185, 129, 0.3); --ban-glow: rgba(244, 63, 94, 0.3); }
        
        body {
            min-height: 100vh;
            background: linear-gradient(-45deg, #050512, #0d122b, #19092c, #061e29, #090919);
            background-size: 400% 400%;
            animation: fluidBg 15s ease infinite;
            color: #f1f5f9;
            padding: 30px 14px 70px;
            display: flex;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes fluidBg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .ambient-glow {
            position: fixed; border-radius: 50%; filter: blur(100px); z-index: 0; pointer-events: none; opacity: 0.6;
            animation: floatGlow 12s infinite alternate ease-in-out;
        }
        .glow-1 { width: 450px; height: 450px; background: radial-gradient(circle, #6366f1, #a855f7); top: -100px; left: -100px; }
        .glow-2 { width: 450px; height: 450px; background: radial-gradient(circle, #06b6d4, #3b82f6); bottom: -120px; right: -120px; animation-duration: 16s; }
        @keyframes floatGlow { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(50px,40px) scale(1.18); } }

        .container { width: 100%; max-width: 1020px; position: relative; z-index: 1; }
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.14); border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 1px 1px rgba(255,255,255,0.25);
        }

        .btn-liquid {
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.03) 100%);
            backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.2);
            color: #fff; font-weight: 700; border-radius: 18px; cursor: pointer;
            box-shadow: 0 8px 25px rgba(0,0,0,0.3), inset 0 1px 1px rgba(255,255,255,0.4);
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .btn-liquid:hover { transform: translateY(-2px); border-color: rgba(255,255,255,0.4); }
        .btn-liquid:active { transform: scale(0.96); }

        .btn-primary-liquid {
            background: linear-gradient(135deg, rgba(6,182,212,0.7) 0%, rgba(139,92,246,0.7) 100%);
            border: 1px solid rgba(255,255,255,0.35);
            box-shadow: 0 8px 25px rgba(6,182,212,0.35), inset 0 1px 1px rgba(255,255,255,0.5);
        }

        .header { text-align: center; margin-bottom: 24px; }
        .brand-badge {
            display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
            background: rgba(139,92,246,0.15); border: 1px solid rgba(139,92,246,0.35);
            border-radius: 999px; font-size: 11px; letter-spacing: 2px; font-weight: 800; color: #d8b4fe;
            margin-bottom: 12px; box-shadow: 0 0 20px var(--primary-glow);
        }
        .brand-badge span { width: 7px; height: 7px; background: #c084fc; border-radius: 50%; }
        h1 {
            font-size: clamp(24px, 5.5vw, 36px); font-weight: 900; letter-spacing: 1px; text-transform: uppercase;
            background: linear-gradient(135deg, #fff 0%, #38bdf8 45%, #c084fc 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 18px; }
        .stat-card { padding: 16px 20px; border-radius: 24px; display: flex; align-items: center; justify-content: space-between; }
        .stat-info span { font-size: 11px; color: #94a3b8; font-weight: 700; text-transform: uppercase; display: block; }
        .stat-info h2 { font-size: clamp(20px, 4.5vw, 28px); font-weight: 900; margin-top: 2px; }
        .stat-icon { width: 44px; height: 44px; border-radius: 16px; display: flex; align-items: center; justify-content: center; font-size: 20px; background: rgba(255,255,255,0.06); }

        .card-form { padding: 22px; margin-bottom: 22px; }
        .form-grid { display: grid; grid-template-columns: 2fr 1.5fr 1.1fr 1.1fr auto; gap: 12px; align-items: center; }
        
        input, select {
            width: 100%; padding: 14px 18px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.14);
            background: rgba(4,7,20,0.6); color: #f8fafc; outline: none; font-size: 14px;
        }
        input:focus, select:focus { border-color: #38bdf8; background: rgba(4,7,20,0.85); }
        select option { background: #0b1120; color: #fff; }
        .btn-add { padding: 14px 26px; white-space: nowrap; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 12px; }
        .filter-group { display: flex; background: rgba(4,7,20,0.5); padding: 5px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1); gap: 5px; }
        .btn-filter { background: transparent; border: none; color: #94a3b8; cursor: pointer; padding: 8px 16px; border-radius: 14px; font-size: 13px; font-weight: 700; }
        .btn-filter.active { background: linear-gradient(135deg, rgba(56,189,248,0.3), rgba(139,92,246,0.3)); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); }

        .toolbar-btns { display: flex; gap: 8px; }
        .btn-tool { padding: 10px 16px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }

        .table-wrap { border-radius: 28px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 16px 22px; font-size: 14px; vertical-align: middle; border-bottom: 1px solid rgba(255,255,255,0.05); }
        th { background: rgba(4,7,20,0.7); color: #94a3b8; font-weight: 800; text-transform: uppercase; font-size: 11px; letter-spacing: 1px; }

        .acc-name { font-weight: 700; color: #f8fafc; word-break: break-all; }
        .acc-note { font-size: 12px; color: #38bdf8; margin-top: 4px; display: inline-flex; align-items: center; gap: 4px; background: rgba(56,189,248,0.1); padding: 3px 10px; border-radius: 10px; border: 1px solid rgba(56,189,248,0.25); }

        .badge { display: inline-flex; align-items: center; padding: 5px 12px; border-radius: 12px; font-size: 11.5px; font-weight: 800; text-transform: uppercase; }
        .badge-live { background: rgba(16,185,129,0.15); color: #34d399; border: 1px solid rgba(52,211,153,0.35); box-shadow: 0 0 15px var(--live-glow); }
        .badge-banned { background: rgba(244,63,94,0.15); color: #fb7185; border: 1px solid rgba(251,113,133,0.35); box-shadow: 0 0 15px var(--ban-glow); }
        .badge-days { background: rgba(245,158,11,0.15); color: #fcd34d; border: 1px solid rgba(252,211,77,0.3); margin-left: 6px; font-weight: 600; text-transform: none; }
        .badge-today { background: rgba(6,182,212,0.2); color: #38bdf8; border: 1px solid rgba(56,189,248,0.4); margin-left: 6px; }

        .actions { display: flex; gap: 8px; justify-content: flex-end; }
        .btn-act { padding: 7px 14px; font-size: 12.5px; font-weight: 700; border-radius: 12px; }

        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(3,6,18,0.82); backdrop-filter: blur(16px);
            justify-content: center; align-items: center; z-index: 999; padding: 16px;
        }
        .modal { background: #090e1c; border: 1px solid rgba(255,255,255,0.18); padding: 28px; border-radius: 28px; width: 100%; max-width: 450px; box-shadow: 0 30px 70px rgba(0,0,0,0.95); }
        .modal h3 { margin-bottom: 18px; font-size: 18px; font-weight: 800; color: #38bdf8; }
        .modal-field { margin-bottom: 14px; }
        .modal-field label { display: block; font-size: 12px; font-weight: 700; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }

        #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; pointer-events: none; max-width: 380px; width: calc(100% - 48px); }
        .custom-toast {
            pointer-events: auto; background: rgba(9,14,28,0.94); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.16);
            border-radius: 18px; padding: 14px 18px; display: flex; align-items: center; gap: 14px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); position: relative; overflow: hidden;
            animation: toastIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275) forwards;
        }
        .custom-toast.hide { animation: toastOut 0.3s forwards ease; }
        .toast-icon { width: 36px; height: 36px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
        .toast-msg { font-size: 13.5px; font-weight: 600; color: #f1f5f9; flex: 1; word-break: break-word; }
        .toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; background: rgba(255,255,255,0.12); }
        .toast-progress-bar { height: 100%; width: 100%; animation: progressCount 2.4s linear forwards; }
        .toast-success { border-color: rgba(52,211,153,0.45); } .toast-success .toast-icon { background: rgba(16,185,129,0.25); color: #34d399; } .toast-success .toast-progress-bar { background: #34d399; }
        .toast-info { border-color: rgba(56,189,248,0.45); } .toast-info .toast-icon { background: rgba(6,182,212,0.25); color: #38bdf8; } .toast-info .toast-progress-bar { background: #38bdf8; }
        .toast-warn { border-color: rgba(244,63,94,0.45); } .toast-warn .toast-icon { background: rgba(244,63,94,0.25); color: #fb7185; } .toast-warn .toast-progress-bar { background: #fb7185; }

        @keyframes toastIn { 0% { opacity: 0; transform: translateY(-20px) scale(0.9); } 100% { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes toastOut { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-20px) scale(0.9); } }
        @keyframes progressCount { 0% { width: 100%; } 100% { width: 0%; } }

        @media (max-width: 720px) {
            body { padding: 16px 8px 60px; }
            .form-grid { grid-template-columns: 1fr; gap: 10px; }
            .btn-add { width: 100%; padding: 15px; font-size: 15px; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .filter-group { width: 100%; justify-content: space-between; }
            .toolbar-btns { width: 100%; }
            .btn-tool { flex: 1; justify-content: center; }
            .table-wrap { background: transparent; border: none; box-shadow: none; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead { display: none; }
            tbody { display: flex; flex-direction: column; gap: 12px; }
            tr {
                background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
                backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.14); border-radius: 22px; padding: 16px;
            }
            td { padding: 4px 0; border-bottom: none; display: flex; align-items: center; justify-content: space-between; }
            td:first-child { display: block; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); padding-bottom: 10px; }
            .actions { width: 100%; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.06); }
            .btn-act { flex: 1; text-align: center; }
            #toastContainer { top: 14px; right: 14px; left: 14px; width: auto; max-width: none; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>
    <div id="toastContainer"></div>

    <div class="container">
        <div class="header">
            <div class="brand-badge"><span></span> HỆ THỐNG QUẢN LÝ ACC</div>
            <h1>QUẢN LÝ ACC VANCAU88</h1>
        </div>

        <div class="stats-grid">
            <div class="stat-card liquid-glass">
                <div class="stat-info"><span>Tổng Acc</span><h2 id="cntAll" style="color: #f8fafc;">0</h2></div>
                <div class="stat-icon">🎮</div>
            </div>
            <div class="stat-card liquid-glass">
                <div class="stat-info"><span>Đang Sống</span><h2 id="cntLive" style="color: #34d399;">0</h2></div>
                <div class="stat-icon" style="background: rgba(16,185,129,0.15); color: #34d399;">⚡</div>
            </div>
            <div class="stat-card liquid-glass">
                <div class="stat-info"><span>Bị Khóa</span><h2 id="cntBanned" style="color: #fb7185;">0</h2></div>
                <div class="stat-icon" style="background: rgba(244,63,94,0.15); color: #fb7185;">🔒</div>
            </div>
        </div>

        <div class="card-form liquid-glass">
            <form id="accForm" onsubmit="handleAdd(event)">
                <div class="form-grid">
                    <input type="text" id="accInfo" placeholder="taikhoan:matkhau" required autocomplete="off">
                    <input type="text" id="accNote" placeholder="Ghi chú (Skin, Rank...)" autocomplete="off">
                    <select id="accStatus" onchange="toggleDateInput('accStatus', 'unbanDate')">
                        <option value="sống">Sống</option>
                        <option value="ban">Bị Ban</option>
                    </select>
                    <input type="text" id="unbanDate" placeholder="Mở ban (100826)" style="display: none;" onblur="formatDateInput(this)">
                    <button type="submit" class="btn-liquid btn-primary-liquid btn-add">+ Thêm Acc</button>
                </div>
            </form>
        </div>

        <div class="toolbar">
            <div class="filter-group">
                <button class="btn-filter active" onclick="setFilter('all', this)">Tất cả (<span id="btnCntAll">0</span>)</button>
                <button class="btn-filter" onclick="setFilter('sống', this)">Sống (<span id="btnCntLive">0</span>)</button>
                <button class="btn-filter" onclick="setFilter('ban', this)">Bị Ban (<span id="btnCntBanned">0</span>)</button>
            </div>
            <div class="toolbar-btns">
                <button type="button" class="btn-liquid btn-tool" onclick="openConfigModal()">⚙ Cấu hình GitHub</button>
                <button type="button" class="btn-liquid btn-tool" onclick="loadFromDataTxt(true)">↻ Tải lại data.txt</button>
            </div>
        </div>

        <div class="table-wrap liquid-glass">
            <table>
                <thead>
                    <tr>
                        <th>Tài khoản / Ghi chú</th>
                        <th>Trạng thái</th>
                        <th>Thời hạn mở</th>
                        <th style="text-align: right;">Thao tác</th>
                    </tr>
                </thead>
                <tbody id="accList"></tbody>
            </table>
        </div>
    </div>

    <!-- Modal Cấu hình GitHub -->
    <div class="modal-overlay" id="configModal">
        <div class="modal">
            <h3>Cấu hình Đồng Bộ GitHub</h3>
            <div class="modal-field">
                <label>GitHub Username (Tên chủ sở hữu)</label>
                <input type="text" id="ghUser" placeholder="vd: vancau88">
            </div>
            <div class="modal-field">
                <label>Repository Name (Tên repo)</label>
                <input type="text" id="ghRepo" placeholder="vd: quanly-acc">
            </div>
            <div class="modal-field">
                <label>Personal Access Token (ghp_...)</label>
                <input type="password" id="ghToken" placeholder="Dán mã Token có quyền repo vào đây">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-liquid btn-act" onclick="closeConfigModal()">Đóng</button>
                <button type="button" class="btn-liquid btn-primary-liquid" style="padding: 10px 22px;" onclick="saveConfig()">Lưu Cấu Hình</button>
            </div>
        </div>
    </div>

    <!-- Modal Sửa -->
    <div class="modal-overlay" id="editModal">
        <div class="modal">
            <h3>Chỉnh sửa tài khoản</h3>
            <input type="hidden" id="editId">
            <div class="modal-field">
                <label>Tài khoản : Mật khẩu</label>
                <input type="text" id="editAcc" required>
            </div>
            <div class="modal-field">
                <label>Ghi chú</label>
                <input type="text" id="editNote" placeholder="Ghi chú (Skin, Rank...)">
            </div>
            <div class="modal-field">
                <label>Trạng thái</label>
                <select id="editStatus" onchange="toggleDateInput('editStatus', 'editDate')">
                    <option value="sống">Sống</option>
                    <option value="ban">Bị Ban</option>
                </select>
            </div>
            <div class="modal-field" id="editDateField">
                <label>Ngày mở ban (dd/mm/yyyy hoặc 6 số)</label>
                <input type="text" id="editDate" placeholder="dd/mm/yyyy" onblur="formatDateInput(this)">
            </div>
            <div class="modal-actions">
                <button type="button" class="btn-liquid btn-act" onclick="closeEditModal()">Hủy</button>
                <button type="button" class="btn-liquid btn-primary-liquid" style="padding: 10px 22px;" onclick="saveEdit()">Lưu lại</button>
            </div>
        </div>
    </div>

    <script>
        let accounts = JSON.parse(localStorage.getItem('vancau88_accounts')) || [];
        let ghConfig = JSON.parse(localStorage.getItem('vancau88_gh_config')) || { user: '', repo: '', token: '' };
        let currentFilter = 'all';

        function showCustomToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            const icon = type === 'info' ? '⚡' : (type === 'warn' ? '✕' : '✓');
            toast.innerHTML = `
                <div class="toast-icon">${icon}</div>
                <div class="toast-msg">${message}</div>
                <div class="toast-progress"><div class="toast-progress-bar"></div></div>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 300); }, 2400);
        }

        function extractUsername(accStr) {
            return (accStr || '').split(':')[0].trim().toLowerCase();
        }

        function parseDateString(str) {
            if (!str || str === '-' || str === 'Chưa rõ') return null;
            const p = str.split('/');
            return p.length === 3 ? new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0])) : null;
        }

        function formatRawDate(str) {
            if (!str) return '';
            let val = str.trim().replace(/\D/g, '');
            if (val.length === 6) return `${val.slice(0,2)}/${val.slice(2,4)}/20${val.slice(4,6)}`;
            if (val.length === 8) return `${val.slice(0,2)}/${val.slice(2,4)}/${val.slice(4,8)}`;
            return str;
        }

        function formatDateInput(input) { input.value = formatRawDate(input.value); }

        function toggleDateInput(selectId, inputId) {
            const status = document.getElementById(selectId).value;
            const input = document.getElementById(inputId);
            input.style.display = status === 'ban' ? 'block' : 'none';
            if (status === 'ban') input.focus(); else input.value = '';
        }

        function getRemainingBadge(dateStr) {
            const target = parseDateString(dateStr);
            if (!target) return '';
            const today = new Date(); today.setHours(0,0,0,0);
            const diff = Math.ceil((target - today) / 86400000);
            if (diff === 0) return '<span class="badge badge-today">Mở hôm nay</span>';
            if (diff > 0) return `<span class="badge badge-days">Còn ${diff} ngày</span>`;
            return '';
        }

        function openConfigModal() {
            document.getElementById('ghUser').value = ghConfig.user || '';
            document.getElementById('ghRepo').value = ghConfig.repo || '';
            document.getElementById('ghToken').value = ghConfig.token || '';
            document.getElementById('configModal').style.display = 'flex';
        }
        function closeConfigModal() { document.getElementById('configModal').style.display = 'none'; }

        function saveConfig() {
            ghConfig = {
                user: document.getElementById('ghUser').value.trim(),
                repo: document.getElementById('ghRepo').value.trim(),
                token: document.getElementById('ghToken').value.trim()
            };
            localStorage.setItem('vancau88_gh_config', JSON.stringify(ghConfig));
            closeConfigModal();
            showCustomToast('Đã lưu cấu hình GitHub!', 'success');
        }

        // Tự động Commit đè lên file data.txt qua GitHub API
        async function syncToGitHub() {
            if (!ghConfig.user || !ghConfig.repo || !ghConfig.token) return;

            const textLines = accounts.map(a => `${a.acc}|${a.status}|${a.unbanDate}|${a.note || ''}`).join('\n');
            const encodedContent = btoa(unescape(encodeURIComponent(textLines)));
            const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/data.txt`;

            try {
                let sha = null;
                const getRes = await fetch(url, { headers: { 'Authorization': `Bearer ${ghConfig.token}` } });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `Bearer ${ghConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Cập nhật data.txt từ web',
                        content: encodedContent,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) {
                    showCustomToast('Đã đồng bộ lên file data.txt trên GitHub!', 'success');
                } else {
                    showCustomToast('Không thể lưu lên GitHub. Kiểm tra lại Token!', 'warn');
                }
            } catch (err) {
                showCustomToast('Lỗi đồng bộ GitHub: ' + err.message, 'warn');
            }
        }

        async function loadFromDataTxt(isManual = false) {
            try {
                const res = await fetch('./data.txt?t=' + Date.now());
                if (!res.ok) throw new Error('Không tìm thấy file data.txt');
                const text = await res.text();
                const lines = text.split('\n');
                const loaded = [];

                lines.forEach((line, idx) => {
                    const clean = line.trim();
                    if (!clean) return;
                    const p = clean.split('|');
                    const acc = p[0].trim();
                    const status = (p[1] && p[1].trim().toLowerCase() === 'ban') ? 'ban' : 'sống';
                    const date = status === 'ban' ? (p[2] ? formatRawDate(p[2]) : 'Chưa rõ') : '-';
                    const note = p[3] ? p[3].trim() : '';

                    const uname = extractUsername(acc);
                    const exist = loaded.findIndex(item => extractUsername(item.acc) === uname);
                    if (exist !== -1) loaded.splice(exist, 1);

                    loaded.push({ id: Date.now() + idx, acc, note, status, unbanDate: date });
                });

                if (loaded.length > 0) {
                    accounts = loaded;
                    saveAndRender(false);
                    if (isManual) showCustomToast(`Đồng bộ thành công ${loaded.length} acc từ data.txt!`, 'info');
                }
            } catch (err) {
                if (isManual) showCustomToast('Lỗi: ' + err.message, 'warn');
            }
        }

        function handleAdd(e) {
            e.preventDefault();
            const accInfo = document.getElementById('accInfo').value.trim();
            const accNote = document.getElementById('accNote').value.trim();
            const status = document.getElementById('accStatus').value;
            let dateVal = document.getElementById('unbanDate').value.trim();
            if (status === 'ban') dateVal = formatRawDate(dateVal);

            const uname = extractUsername(accInfo);
            const existIndex = accounts.findIndex(item => extractUsername(item.acc) === uname);
            if (existIndex !== -1) accounts.splice(existIndex, 1);

            accounts.unshift({
                id: Date.now(),
                acc: accInfo,
                note: accNote,
                status: status,
                unbanDate: status === 'ban' ? (dateVal || 'Chưa rõ') : '-'
            });

            saveAndRender(true);
            document.getElementById('accForm').reset();
            toggleDateInput('accStatus', 'unbanDate');
        }

        function openEditModal(id) {
            const item = accounts.find(a => a.id === id);
            if (!item) return;
            document.getElementById('editId').value = item.id;
            document.getElementById('editAcc').value = item.acc;
            document.getElementById('editNote').value = item.note || '';
            document.getElementById('editStatus').value = item.status;
            document.getElementById('editDate').value = item.unbanDate === '-' ? '' : item.unbanDate;
            toggleDateInput('editStatus', 'editDate');
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeEditModal() { document.getElementById('editModal').style.display = 'none'; }

        function saveEdit() {
            const id = parseInt(document.getElementById('editId').value);
            const item = accounts.find(a => a.id === id);
            if (!item) return;

            const accStr = document.getElementById('editAcc').value.trim();
            const uname = extractUsername(accStr);
            const dup = accounts.findIndex(a => a.id !== id && extractUsername(a.acc) === uname);
            if (dup !== -1) accounts.splice(dup, 1);

            item.acc = accStr;
            item.note = document.getElementById('editNote').value.trim();
            item.status = document.getElementById('editStatus').value;
            let dateVal = document.getElementById('editDate').value.trim();
            item.unbanDate = item.status === 'ban' ? (formatRawDate(dateVal) || 'Chưa rõ') : '-';

            closeEditModal();
            saveAndRender(true);
        }

        function deleteAcc(id) {
            accounts = accounts.filter(item => item.id !== id);
            saveAndRender(true);
        }

        function copyAcc(text) {
            navigator.clipboard.writeText(text);
            showCustomToast('Đã copy: ' + text, 'info');
        }

        function setFilter(f, el) {
            currentFilter = f;
            document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            render();
        }

        function saveAndRender(autoSync = false) {
            localStorage.setItem('vancau88_accounts', JSON.stringify(accounts));
            render();
            if (autoSync) syncToGitHub();
        }

        function render() {
            const cntLive = accounts.filter(a => a.status === 'sống').length;
            const cntBanned = accounts.filter(a => a.status === 'ban').length;

            document.getElementById('cntAll').innerText = accounts.length;
            document.getElementById('cntLive').innerText = cntLive;
            document.getElementById('cntBanned').innerText = cntBanned;
            document.getElementById('btnCntAll').innerText = accounts.length;
            document.getElementById('btnCntLive').innerText = cntLive;
            document.getElementById('btnCntBanned').innerText = cntBanned;

            const filtered = accounts.filter(item => currentFilter === 'all' ? true : item.status === currentFilter);
            const tbody = document.getElementById('accList');
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #64748b; padding: 40px 0;">Không có tài khoản nào</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const isBan = item.status === 'ban';
                const noteHtml = item.note ? `<div class="acc-note">📝 ${item.note}</div>` : '';
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><div class="acc-name">${item.acc}</div>${noteHtml}</td>
                    <td><span class="badge ${isBan ? 'badge-banned' : 'badge-live'}">${isBan ? '🔒 BAN' : '⚡ SỐNG'}</span></td>
                    <td><span style="color: ${isBan ? '#f1f5f9' : '#64748b'}">${item.unbanDate}</span> ${isBan ? getRemainingBadge(item.unbanDate) : ''}</td>
                    <td>
                        <div class="actions">
                            <button class="btn-liquid btn-act" onclick="copyAcc('${item.acc}')">Copy</button>
                            <button class="btn-liquid btn-act" onclick="openEditModal(${item.id})">Sửa</button>
                            <button class="btn-liquid btn-act" onclick="deleteAcc(${item.id})">Xóa</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        saveAndRender(false);
        loadFromDataTxt();
    </script>
</body>
</html>
