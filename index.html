<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>QUẢN LÝ ACC VANCAU88 - SMART PRO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --sky: #38bdf8;
            --cyan: #06b6d4;
            --emerald: #10b981;
            --rose: #f43f5e;
            --amber: #f59e0b;
            --violet: #8b5cf6;

            --bg: #040714;
            --card: rgba(12, 18, 38, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --border-active: rgba(56, 189, 248, 0.4);
            --row: rgba(15, 23, 48, 0.65);
            --row-hover: rgba(26, 38, 76, 0.85);

            --r-xl: 16px;
            --r-lg: 12px;
            --r-md: 8px;
            --r-sm: 6px;

            --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
            --mono: 'JetBrains Mono', monospace;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: var(--font);
            min-height: 100vh;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 15%, rgba(6, 182, 212, 0.10) 0%, transparent 40%),
                radial-gradient(circle at 50% 85%, rgba(168, 85, 247, 0.08) 0%, transparent 45%);
            background-attachment: fixed;
            color: #f1f5f9;
            padding: 20px 14px 70px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--r-xl);
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
        }

        /* ── Buttons ── */
        .btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #f1f5f9;
            font-family: var(--font);
            font-weight: 700;
            font-size: 13px;
            border-radius: var(--r-md);
            cursor: pointer;
            transition: transform 0.12s ease, background-color 0.12s ease, border-color 0.12s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            user-select: none;
            padding: 8px 14px;
        }

        .btn:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.28);
            background: rgba(255, 255, 255, 0.12);
        }

        .btn:active { transform: scale(0.97); }

        .btn-icon {
            width: 15px;
            height: 15px;
            display: inline-block;
            vertical-align: middle;
            stroke-width: 2;
            flex-shrink: 0;
        }

        .btn-primary {
            background: linear-gradient(135deg, #0284c7 0%, #6366f1 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #fff;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
        }
        .btn-primary:hover { background: linear-gradient(135deg, #0ea5e9 0%, #4f46e5 100%); }

        .btn-config { background: rgba(245, 158, 11, 0.12); border-color: rgba(245, 158, 11, 0.3); color: #fbbf24; }
        .btn-mask { background: rgba(14, 165, 233, 0.12); border-color: rgba(14, 165, 233, 0.3); color: var(--sky); }
        .btn-mask.active { background: rgba(139, 92, 246, 0.22); border-color: rgba(168, 85, 247, 0.5); color: #d8b4fe; }
        .btn-danger { background: #e11d48; border-color: rgba(255, 255, 255, 0.2); color: #fff; }

        /* Row Action Buttons */
        .btn-copy { background: rgba(6, 182, 212, 0.15); border-color: rgba(6, 182, 212, 0.35); color: #38bdf8; }
        .btn-edit { background: rgba(139, 92, 246, 0.15); border-color: rgba(139, 92, 246, 0.35); color: #c084fc; }
        .btn-del { background: rgba(244, 63, 94, 0.15); border-color: rgba(244, 63, 94, 0.35); color: #fb7185; }

        /* Presets Chips for Ban duration */
        .presets-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .btn-preset {
            padding: 5px 9px;
            font-size: 11px;
            font-weight: 700;
            border-radius: var(--r-sm);
            background: rgba(244, 63, 94, 0.12);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: #fca5a5;
            cursor: pointer;
            transition: all 0.12s ease;
        }
        .btn-preset:hover {
            background: rgba(244, 63, 94, 0.25);
            border-color: rgba(244, 63, 94, 0.6);
            color: #fff;
            transform: translateY(-1px);
        }

        /* ── Header ── */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 12px;
        }

        h1 {
            font-size: clamp(20px, 4.5vw, 26px);
            font-weight: 900;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: linear-gradient(130deg, #ffffff 0%, #38bdf8 60%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* ── Dashboard Stats ── */
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 14px;
        }

        .stat-card {
            padding: 14px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.15s ease;
        }

        .stat-card:hover {
            transform: translateY(-2px);
            border-color: var(--border-active);
        }

        .stat-info span {
            display: block;
            font-size: 10.5px;
            color: #94a3b8;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-info h2 {
            font-size: clamp(19px, 3vw, 24px);
            font-weight: 900;
            line-height: 1.1;
            margin-top: 2px;
        }

        .stat-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }

        /* ── Form Card ── */
        .form-card {
            padding: 16px;
            margin-bottom: 14px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 2fr 1.6fr 1.1fr 1.1fr auto;
            gap: 10px;
            align-items: start;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px 13px;
            border-radius: var(--r-md);
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(8, 13, 28, 0.85);
            color: #f8fafc;
            outline: none;
            font-size: 13.5px;
            font-family: var(--font);
            transition: border-color 0.15s;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--sky);
            background: rgba(11, 18, 38, 0.95);
        }

        select option { background: #080d1c; color: #f8fafc; }

        textarea {
            resize: vertical;
            min-height: 44px;
            font-family: var(--mono);
            font-size: 13px;
            line-height: 1.4;
        }

        .btn-add {
            height: 44px;
            padding: 0 20px;
            white-space: nowrap;
        }

        /* ── Controls Panel ── */
        .controls {
            padding: 12px 16px;
            margin-bottom: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .search-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 220px;
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            padding-left: 36px;
            padding-right: 32px;
            height: 40px;
        }

        .search-icon {
            position: absolute;
            left: 12px;
            color: #64748b;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .btn-clear-search {
            position: absolute;
            right: 8px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #94a3b8;
            cursor: pointer;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .sort-select {
            height: 40px;
            min-width: 170px;
            font-size: 12.5px;
            font-weight: 700;
        }

        .filter-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-group {
            display: flex;
            background: rgba(8, 13, 28, 0.85);
            padding: 3px;
            border-radius: var(--r-md);
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 3px;
            flex-wrap: wrap;
        }

        .btn-filter {
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--r-sm);
            font-size: 12px;
            font-weight: 700;
            font-family: var(--font);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-filter.active {
            background: rgba(56, 189, 248, 0.18);
            color: var(--sky);
            border-color: rgba(56, 189, 248, 0.4);
        }

        .sync-badge {
            font-size: 11.5px;
            font-weight: 700;
            padding: 6px 12px;
            border-radius: var(--r-md);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.28);
            color: #34d399;
        }

        /* ── Bulk Toolbar ── */
        .bulk-bar {
            display: none;
            background: rgba(14, 23, 48, 0.95);
            border: 1px solid rgba(56, 189, 248, 0.45);
            padding: 10px 14px;
            border-radius: var(--r-lg);
            margin-bottom: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .bulk-info {
            font-size: 13px;
            font-weight: 800;
            color: var(--sky);
        }

        .bulk-btns { display: flex; gap: 6px; flex-wrap: wrap; }

        /* ── Table & Cards ── */
        .table-wrap {
            border-radius: var(--r-xl);
            overflow: hidden;
            margin-bottom: 16px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 11px 14px;
            font-size: 13px;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        th {
            background: rgba(8, 13, 28, 0.95);
            color: #94a3b8;
            font-weight: 800;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 0.6px;
            white-space: nowrap;
        }

        tbody tr {
            background: var(--row);
            transition: background-color 0.12s;
        }

        tbody tr:hover { background: var(--row-hover); }

        .col-check { width: 42px; text-align: center; }

        .custom-check {
            width: 17px;
            height: 17px;
            accent-color: var(--sky);
            cursor: pointer;
            border-radius: 4px;
        }

        .acc-text-box { display: flex; flex-direction: column; gap: 3px; }

        .acc-name {
            font-family: var(--mono);
            font-size: 13.5px;
            font-weight: 700;
            color: #f8fafc;
            word-break: break-all;
        }

        .acc-tags { display: flex; flex-wrap: wrap; gap: 4px; }

        .acc-note {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 7px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            word-break: break-word;
        }

        .badge-rank-vang    { background: rgba(234, 179, 8, 0.15);  color: #fde047; border: 1px solid rgba(234, 179, 8, 0.4); }
        .badge-rank-bkim    { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.4); }
        .badge-rank-kcuong  { background: rgba(168, 85, 247, 0.15); color: #d8b4fe; border: 1px solid rgba(168, 85, 247, 0.4); }
        .badge-rank-tanhanh { background: rgba(236, 72, 153, 0.15); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.4); }
        .badge-rank-caothu  { background: rgba(239, 68, 68, 0.15);  color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.4); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 9px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .badge-live { background: rgba(16, 185, 129, 0.14); color: #34d399; border: 1px solid rgba(52, 211, 153, 0.35); }
        .badge-banned { background: rgba(244, 63, 94, 0.14); color: #fb7185; border: 1px solid rgba(251, 113, 133, 0.35); }
        .badge-days { background: rgba(245, 158, 11, 0.16); color: #fcd34d; border: 1px solid rgba(252, 211, 77, 0.35); margin-left: 6px; text-transform: none; }
        .badge-today { background: rgba(6, 182, 212, 0.2); color: var(--sky); border: 1px solid rgba(56, 189, 248, 0.45); margin-left: 6px; }

        .actions { display: flex; gap: 6px; justify-content: flex-end; }

        /* ── Pagination ── */
        .pagination {
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .page-info { font-size: 12px; color: #94a3b8; font-weight: 600; }
        .page-ctrls { display: flex; align-items: center; gap: 4px; }
        .btn-page { min-width: 32px; height: 32px; padding: 0 7px; font-size: 12px; }
        .btn-page.active { background: rgba(56, 189, 248, 0.25); color: var(--sky); border-color: rgba(56, 189, 248, 0.5); }
        .btn-page:disabled { opacity: 0.3; cursor: not-allowed; }

        /* ── Modals ── */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.78);
            justify-content: center;
            align-items: center;
            z-index: 999;
            padding: 16px;
        }

        .modal {
            background: #0c1328;
            border: 1px solid rgba(255, 255, 255, 0.16);
            padding: 22px;
            border-radius: var(--r-xl);
            width: 100%;
            max-width: 440px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal h3 {
            margin-bottom: 14px;
            font-size: 16px;
            font-weight: 800;
            color: var(--sky);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .modal-field { margin-bottom: 12px; }
        .modal-field label { display: block; font-size: 11px; font-weight: 800; color: #94a3b8; margin-bottom: 4px; text-transform: uppercase; }
        .modal-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; gap: 8px; }

        /* ── Toasts ── */
        #toastContainer {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: none;
            max-width: 340px;
            width: calc(100% - 32px);
        }

        .custom-toast {
            pointer-events: auto;
            background: #0d152b;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: var(--r-md);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            transition: opacity 0.2s;
        }

        .custom-toast.hide { opacity: 0; }
        .toast-icon { width: 28px; height: 28px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
        .toast-msg { font-size: 12.5px; font-weight: 700; color: #f1f5f9; flex: 1; word-break: break-word; }
        .toast-success { border-color: rgba(52, 211, 153, 0.4); }
        .toast-success .toast-icon { background: rgba(16, 185, 129, 0.2); color: #34d399; }
        .toast-info { border-color: rgba(56, 189, 248, 0.4); }
        .toast-info .toast-icon { background: rgba(6, 182, 212, 0.2); color: var(--sky); }
        .toast-warn { border-color: rgba(244, 63, 94, 0.4); }
        .toast-warn .toast-icon { background: rgba(244, 63, 94, 0.2); color: #fb7185; }

        .mobile-card-top { display: none; }
        .desktop-only { display: table-cell; }

        /* ── Mobile Layout ── */
        @media (max-width: 768px) {
            body { padding: 12px 10px 70px; }
            .header { flex-direction: column; align-items: stretch; gap: 10px; margin-bottom: 12px; }
            .header-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
            .header-actions .btn-config { grid-column: 1 / -1; }

            .stats { grid-template-columns: repeat(2, 1fr); gap: 6px; margin-bottom: 10px; }
            .stat-card { padding: 10px 12px; }
            .stat-icon { width: 32px; height: 32px; font-size: 15px; }

            .form-card { padding: 12px; margin-bottom: 10px; }
            .form-grid { grid-template-columns: 1fr; gap: 8px; }
            .btn-add { width: 100%; }

            .controls { padding: 10px 12px; gap: 8px; margin-bottom: 10px; }
            .search-row { flex-direction: column; gap: 6px; }
            .search-box, .sort-select { width: 100%; }
            .filter-row { flex-direction: column; align-items: stretch; gap: 6px; }
            .filter-group { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
            .btn-filter { justify-content: center; }
            .sync-badge { width: 100%; justify-content: center; }

            .bulk-bar { flex-direction: column; align-items: stretch; padding: 10px; }
            .bulk-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
            .bulk-btns .btn { justify-content: center; }

            /* Mobile Card List */
            .table-wrap { background: transparent !important; border: none !important; box-shadow: none !important; }
            table, thead, tbody, th, td, tr { display: block; width: 100%; }
            thead { display: none; }
            tbody { display: flex; flex-direction: column; gap: 8px; }

            tbody tr {
                background: #0d152c !important;
                border: 1px solid rgba(255, 255, 255, 0.09) !important;
                border-radius: var(--r-lg) !important;
                padding: 12px !important;
            }

            .desktop-only, td.col-check { display: none !important; }
            td { padding: 0 !important; border: none !important; }

            .mobile-card-top {
                display: flex !important;
                align-items: center;
                justify-content: space-between;
                padding-bottom: 6px;
                margin-bottom: 6px;
                border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            }

            .mobile-check-label {
                display: inline-flex;
                align-items: center;
                gap: 6px;
                font-size: 11.5px;
                font-weight: 700;
                color: #94a3b8;
            }

            td.cell-acc-main { padding-bottom: 4px !important; }
            .acc-name { font-size: 13px; }

            td.cell-date-info { padding-bottom: 6px !important; }
            .mobile-date-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                font-size: 11.5px;
                color: #94a3b8;
            }

            td.cell-actions {
                margin-top: 4px;
                padding-top: 8px !important;
                border-top: 1px solid rgba(255, 255, 255, 0.06);
            }

            .actions {
                display: grid !important;
                grid-template-columns: 1fr 1fr 1fr;
                gap: 6px;
                width: 100%;
            }

            .actions .btn { width: 100%; justify-content: center; padding: 8px 4px; font-size: 12px; }

            .pagination { flex-direction: column; align-items: center; gap: 8px; padding: 10px; }
        }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <div class="container">
        
        <!-- Header -->
        <div class="header">
            <div>
                <div class="brand-badge" style="display: none;"></div>
                <h1>QUẢN LÝ ACC VANCAU88</h1>
            </div>
            <div class="header-actions">
                <button type="button" class="btn btn-mask" id="btnMaskToggle" onclick="toggleMaskMode()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                    <span>Ẩn MK</span>
                </button>
                <button type="button" class="btn" onclick="openImportExportModal()">
                    <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                    <span>Nhập / Xuất</span>
                </button>
                <button type="button" class="btn btn-config" onclick="openConfigModal()">

    <script>
        const ICONS = {
            copy: `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>`,
            edit: `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>`,
            del:  `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>`,
            eye:  `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`,
            eyeOff: `<svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`
        };

        // --- DATA & STATE ---
        let accounts = JSON.parse(localStorage.getItem('vancau88_accounts')) || [];
        let ghConfig = JSON.parse(localStorage.getItem('vancau88_gh_config')) || { user: '', repo: '', token: '' };
        let appSettings = JSON.parse(localStorage.getItem('vancau88_settings')) || { maskMode: false, rowsPerPage: 25, sort: 'newest' };
        
        let currentFilter = 'all';
        let searchQuery = '';
        let currentSort = appSettings.sort || 'newest';
        let currentPage = 1;
        let rowsPerPage = parseInt(appSettings.rowsPerPage) || 25;
        let isMasked = !!appSettings.maskMode;
        let selectedIds = new Set();
        let isSyncing = false;
        let pendingDeleteAction = null;

        // --- DURATION PRESET CALCULATION ---
        function calculatePresetDate(days = 0, months = 0, years = 0) {
            const d = new Date();
            d.setHours(0,0,0,0);
            if (days) d.setDate(d.getDate() + days);
            if (months) d.setMonth(d.getMonth() + months);
            if (years) d.setFullYear(d.getFullYear() + years);

            const day = String(d.getDate()).padStart(2, '0');
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const year = d.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function setPresetDate(inputId, days = 0, months = 0, years = 0) {
            const input = document.getElementById(inputId);
            if (input) {
                input.value = calculatePresetDate(days, months, years);
            }
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        function showCustomToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `custom-toast toast-${type}`;
            const icon = type === 'info' ? '⚡' : (type === 'warn' ? '✕' : '✓');
            toast.innerHTML = `
                <div class="toast-icon">${icon}</div>
                <div class="toast-msg">${escapeHtml(message)}</div>
            `;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 200); }, 2200);
        }

        function setSyncStatus(text, syncing = false) {
            const el = document.getElementById('syncStatus');
            if (el) el.innerText = text;
        }

        function utf8ToBase64(str) {
            return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g, (match, p1) => String.fromCharCode('0x' + p1)));
        }

        function base64ToUtf8(str) {
            return decodeURIComponent(Array.prototype.map.call(atob(str), c => '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)).join(''));
        }

        function extractUsername(accStr) {
            return (accStr || '').split(':')[0].trim().toLowerCase();
        }

        function parseDateString(str) {
            if (!str || str === '-' || str === 'Chưa rõ') return null;
            const p = str.split('/');
            return p.length === 3 ? new Date(parseInt(p[2]), parseInt(p[1]) - 1, parseInt(p[0])) : null;
        }

        function formatRawDate(str) {
            if (!str) return '';
            let val = str.trim().replace(/\D/g, '');
            if (val.length === 6) return `${val.slice(0,2)}/${val.slice(2,4)}/20${val.slice(4,6)}`;
            if (val.length === 8) return `${val.slice(0,2)}/${val.slice(2,4)}/${val.slice(4,8)}`;
            return str;
        }

        function formatDateInput(input) { input.value = formatRawDate(input.value); }

        function toggleDateInput(selectId, boxId) {
            const status = document.getElementById(selectId).value;
            const box = document.getElementById(boxId);
            box.style.display = status === 'ban' ? 'block' : 'none';
        }

        function getRemainingDays(dateStr) {
            const target = parseDateString(dateStr);
            if (!target) return null;
            const today = new Date(); today.setHours(0,0,0,0);
            return Math.ceil((target - today) / 86400000);
        }

        function getRemainingBadge(dateStr) {
            const diff = getRemainingDays(dateStr);
            if (diff === null) return '';
            if (diff === 0) return '<span class="badge badge-today">Mở hôm nay</span>';
            if (diff > 0) return `<span class="badge badge-days">Còn ${diff} ngày</span>`;
            return '<span class="badge badge-days" style="color:#94a3b8;">Quá hạn</span>';
        }

        function formatAccDisplay(accStr) {
            if (!isMasked) return escapeHtml(accStr);
            const parts = accStr.split(':');
            if (parts.length >= 2) {
                const user = parts[0];
                const pass = parts.slice(1).join(':');
                return `${escapeHtml(user)}:<span style="letter-spacing:2px; color:#94a3b8;">${'•'.repeat(Math.min(Math.max(pass.length, 6), 12))}</span>`;
            }
            return escapeHtml(accStr);
        }

        function formatNoteBadges(noteStr) {
            if (!noteStr) return '';
            const safeNote = escapeHtml(noteStr);
            const lower = noteStr.toLowerCase();
            let rankClass = '';
            if (lower.includes('cao thủ') || lower.includes('chiến tướng')) rankClass = 'badge-rank-caothu';
            else if (lower.includes('tinh anh')) rankClass = 'badge-rank-tanhanh';
            else if (lower.includes('kim cương') || lower.includes('k.cương')) rankClass = 'badge-rank-kcuong';
            else if (lower.includes('bạch kim') || lower.includes('b.kim')) rankClass = 'badge-rank-bkim';
            else if (lower.includes('vàng')) rankClass = 'badge-rank-vang';

            return `<div class="acc-note ${rankClass}">📝 ${safeNote}</div>`;
        }

        function toggleMaskMode() {
            isMasked = !isMasked;
            appSettings.maskMode = isMasked;
            localStorage.setItem('vancau88_settings', JSON.stringify(appSettings));
            updateMaskButton();
            render();
            showCustomToast(isMasked ? 'Đã ẩn MK' : 'Đã hiện MK', 'info');
        }

        function updateMaskButton() {
            const btn = document.getElementById('btnMaskToggle');
            if (!btn) return;
            if (isMasked) {
                btn.innerHTML = `${ICONS.eyeOff} <span>Đang Ẩn MK</span>`;
                btn.classList.add('active');
            } else {
                btn.innerHTML = `${ICONS.eye} <span>Ẩn MK</span>`;

        // --- SMART COPY: ĐƯA ACC VỪA SAO CHÉP LÊN ĐẦU DANH SÁCH ---
        function copyAcc(text, id = null) {
            // Push to top of list!
            let foundIdx = -1;
            if (id !== null) {
                foundIdx = accounts.findIndex(a => a.id === id);
            } else {
                foundIdx = accounts.findIndex(a => a.acc === text);
            }

            if (foundIdx > 0) {
                const [item] = accounts.splice(foundIdx, 1);
                accounts.unshift(item); // Push to top!
                saveAndSync();
            }

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(() => {
                    showCustomToast('Đã copy & đưa lên đầu: ' + text, 'info');
                }).catch(() => fallbackCopy(text));
            } else {
                fallbackCopy(text);
            }
        }

        function fallbackCopy(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                showCustomToast('Đã copy & đưa lên đầu: ' + text, 'info');
            } catch (err) {
                showCustomToast('Không thể sao chép!', 'warn');
            }
            document.body.removeChild(ta);
        }

        function getFilteredAndSortedAccounts() {
            let list = [...accounts];

            if (currentFilter === 'sống') {
                list = list.filter(a => a.status === 'sống');
            } else if (currentFilter === 'ban') {
                list = list.filter(a => a.status === 'ban');
            } else if (currentFilter === 'today') {
                list = list.filter(a => a.status === 'ban' && getRemainingDays(a.unbanDate) === 0);
            }

            if (searchQuery) {
                list = list.filter(a => {
                    const accMatch = (a.acc || '').toLowerCase().includes(searchQuery);
                    const noteMatch = (a.note || '').toLowerCase().includes(searchQuery);
                    const dateMatch = (a.unbanDate || '').toLowerCase().includes(searchQuery);
                    const statusMatch = (a.status || '').toLowerCase().includes(searchQuery);
                    return accMatch || noteMatch || dateMatch || statusMatch;
                });
            }

            list.sort((a, b) => {
                if (currentSort === 'newest') return 0; // Maintain custom top order!
                if (currentSort === 'oldest') return (a.id || 0) - (b.id || 0);
                if (currentSort === 'nameAsc') return (a.acc || '').localeCompare(b.acc || '');
                if (currentSort === 'nameDesc') return (b.acc || '').localeCompare(a.acc || '');
                if (currentSort === 'unbanSoon') {
                    const da = parseDateString(a.unbanDate);
                    const db = parseDateString(b.unbanDate);
                    if (a.status !== 'ban' && b.status !== 'ban') return 0;
                    if (a.status !== 'ban') return 1;
                    if (b.status !== 'ban') return -1;
                    if (!da && !db) return 0;
                    if (!da) return 1;
                    if (!db) return -1;
                    return da - db;
                }
                return 0;
            });

            return list;
        }

        async function testConnection() {

        async function syncToGitHub() {
            if (isSyncing || !ghConfig.user || !ghConfig.repo || !ghConfig.token) return;
            isSyncing = true;
            setSyncStatus('🔄 Đang lưu...', true);

            const textLines = accounts.map(a => `${a.acc}|${a.status}|${a.unbanDate}|${a.note || ''}`).join('\n');
            const encodedContent = utf8ToBase64(textLines);
            const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/data.txt`;

            try {
                let sha = null;
                const getRes = await fetch(url + '?t=' + Date.now(), {
                    headers: { 'Authorization': `token ${ghConfig.token}` }
                });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    sha = getData.sha;
                }

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${ghConfig.token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: 'Sync from smart web app',
                        content: encodedContent,
                        sha: sha || undefined
                    })
                });

                if (putRes.ok) setSyncStatus('🟢 GitHub Sync');
                else setSyncStatus('⚠️ Lỗi lưu');
            } catch (err) {
                setSyncStatus('⚠️ Lỗi kết nối');
            } finally {
                isSyncing = false;
            }
        }

        function checkAutoUnban() {
            const today = new Date(); today.setHours(0,0,0,0);
            let updated = false;
            accounts.forEach(acc => {
                if (acc.status === 'ban') {
                    const target = parseDateString(acc.unbanDate);
                    if (target && today >= target) {
                        acc.status = 'sống';
                        acc.autoUnbanned = true;
                        acc.unbanDate = '-';
                        updated = true;
                    }
                }
            });
            return updated;
        }

        async function autoPullData() {
            if (isSyncing) return;
            let dataLoaded = false;
            if (ghConfig.user && ghConfig.repo && ghConfig.token) {
                const url = `https://api.github.com/repos/${ghConfig.user}/${ghConfig.repo}/contents/data.txt?t=` + Date.now();
                try {
                    const res = await fetch(url, { headers: { 'Authorization': `token ${ghConfig.token}` } });
                    if (res.ok) {
                        const data = await res.json();
                        parseAndLoadText(base64ToUtf8(data.content));
                        dataLoaded = true;
                        setSyncStatus('🟢 GitHub Sync');
                    }
                } catch(e) {}
            }

            if (!dataLoaded) {
                try {
                    const res = await fetch('./data.txt?t=' + Date.now());
                    if (res.ok) {
                        const text = await res.text();
                        parseAndLoadText(text);
                    }
                } catch (e) {}
            }
            if (checkAutoUnban()) saveAndSync();
        }

        function parseAndLoadText(text, isAppend = false) {
            const lines = text.split('\n');
            const loaded = isAppend ? [...accounts] : [];
            let addedCount = 0;

            lines.forEach((line, idx) => {
                const clean = line.trim();
                if (!clean) return;
                const p = clean.split('|');
                const acc = p[0].trim();
                const status = (p[1] && p[1].trim().toLowerCase() === 'ban') ? 'ban' : 'sống';
                const date = status === 'ban' ? (p[2] ? formatRawDate(p[2]) : 'Chưa rõ') : '-';
                const note = p[3] ? p[3].trim() : '';

                const uname = extractUsername(acc);
                const exist = loaded.findIndex(item => extractUsername(item.acc) === uname);
                if (exist !== -1) loaded.splice(exist, 1);

                loaded.push({ id: Date.now() + idx + Math.floor(Math.random()*1000), acc, note, status, unbanDate: date, autoUnbanned: false });
                addedCount++;
            });

            if (loaded.length > 0) {
                accounts = loaded;
                localStorage.setItem('vancau88_accounts', JSON.stringify(accounts));
                render();
            }
            return addedCount;
        }

        function handleAdd(e) {
            e.preventDefault();
            const accText = document.getElementById('accInfo').value.trim();
            const globalNote = document.getElementById('accNote').value.trim();
            const status = document.getElementById('accStatus').value;
            let dateVal = document.getElementById('unbanDate').value.trim();
            if (status === 'ban') dateVal = formatRawDate(dateVal);

            const lines = accText.split('\n');
            let addedCount = 0;

            lines.forEach((line, idx) => {
                let rawLine = line.trim();
                if (!rawLine) return;

                let finalAcc = rawLine;
                let finalNote = globalNote;

                const parts = rawLine.split(':');
                if (parts.length >= 3) {
                    finalAcc = parts[0].trim() + ':' + parts[1].trim();
                    finalNote = parts.slice(2).join(':').trim();
                }

                const uname = extractUsername(finalAcc);
                const existIndex = accounts.findIndex(item => extractUsername(item.acc) === uname);
                if (existIndex !== -1) accounts.splice(existIndex, 1);

                accounts.unshift({
                    id: Date.now() + idx + Math.floor(Math.random()*1000),
                    acc: finalAcc,
                    note: finalNote,
                    status: status,
                    unbanDate: status === 'ban' ? (dateVal || 'Chưa rõ') : '-',
                    autoUnbanned: false
                });
                addedCount++;
            });

            if (addedCount > 0) {
                saveAndSync();
                document.getElementById('accForm').reset();
                toggleDateInput('accStatus', 'unbanDateBox');
                showCustomToast(`Đã thêm ${addedCount} acc!`, 'success');
            }
        }

        function exportData(type) {
            let dataStr = '';
            let filename = '';
            let mime = 'text/plain';

            if (type === 'txt') {
                dataStr = accounts.map(a => `${a.acc}|${a.status}|${a.unbanDate}|${a.note || ''}`).join('\n');
                filename = 'data.txt';
            } else if (type === 'csv') {
                const rows = [['Tài khoản : Mật khẩu', 'Trạng thái', 'Ngày mở ban', 'Ghi chú']];
                accounts.forEach(a => {
                    rows.push([`"${(a.acc||'').replace(/"/g, '""')}"`, a.status, a.unbanDate, `"${(a.note||'').replace(/"/g, '""')}"`]);
                });
                dataStr = '\uFEFF' + rows.map(r => r.join(',')).join('\n');
                filename = `accounts_${Date.now()}.csv`;
                mime = 'text/csv;charset=utf-8;';
            } else if (type === 'json') {
                dataStr = JSON.stringify(accounts, null, 2);
                filename = `accounts_backup_${Date.now()}.json`;
                mime = 'application/json';
            }

            const blob = new Blob([dataStr], { type: mime });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showCustomToast(`Đã xuất ${filename}!`, 'success');
        }

        function handleFileSelected(e) {

            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(evt) {
                const content = evt.target.result;
                try {
                    if (file.name.endsWith('.json')) {
                        const json = JSON.parse(content);
                        if (Array.isArray(json)) {
                            accounts = json;
                            localStorage.setItem('vancau88_accounts', JSON.stringify(accounts));
                            saveAndSync();
                            showCustomToast(`Đã nạp ${accounts.length} acc!`, 'success');
                        }
                    } else {
                        const count = parseAndLoadText(content, false);
                        saveAndSync();
                        showCustomToast(`Đã nạp ${count} acc!`, 'success');
                    }
                } catch(err) {
                    showCustomToast('File sai định dạng!', 'warn');
                }
                closeModal('importExportModal');
                e.target.value = '';
            };
            reader.readAsText(file);
        }

        document.addEventListener("visibilitychange", () => {
            if (document.visibilityState === "visible") {
                setSyncStatus('🔄 Đồng bộ...', true);
                autoPullData();
            }
        });

        setInterval(() => {
            if (document.visibilityState === "visible") autoPullData();
        }, 60000);
    </script>
